<div class="layout">
  <aside class="sidebar">
    <header class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">World Watcher</span>
      <span class="brand__count">{{ visibleCount() }}</span>
    </header>

    <div class="search">
      <input
        type="search"
        class="search__input"
        placeholder="Search a place, city or tag"
        aria-label="Search streams"
        [value]="filters().search"
        (input)="onSearch($event)"
      />
    </div>

    <div class="scroll">
      <section class="block">
        <div class="block__head">
          <h2 class="block__title">Categories</h2>
          @if (hasFilters()) {
            <button type="button" class="link" (click)="onFiltersReset()">Clear</button>
          }
        </div>
        <app-category-filter
          [options]="categories()"
          [selected]="filters().categories"
          (categoryToggled)="onCategoryToggled($event)"
        />
      </section>

      <section class="block">
        <div class="block__head">
          <h2 class="block__title">Streams</h2>
        </div>

        @if (error(); as message) {
          <p class="error">{{ message }}</p>
        } @else {
          <app-stream-list
            [streams]="streams()"
            [selectedId]="selected()?.id ?? null"
            [loading]="loading()"
            (streamSelected)="onStreamSelected($event)"
          />
        }
      </section>
    </div>

    <app-stream-player [stream]="selected()" (closed)="onPlayerClosed()" />
  </aside>

  <main class="map-area">
    <app-stream-map
      [streams]="streams()"
      [selectedId]="selected()?.id ?? null"
      (streamSelected)="onStreamSelected($event)"
    />
  </main>
</div>
