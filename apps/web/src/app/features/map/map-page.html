<div class="layout">
  <app-stream-map
    [streams]="streams()"
    [selectedId]="selected()?.id ?? null"
    (streamSelected)="onStreamSelected($event)"
  />

  <!-- Everything below floats over the map. The map is the page; the
       interface is a thin layer on top of it that gets out of the way. -->
  <div class="hud" #hud>
    <div class="bar" [class.bar--open]="panelOpen()">
      <span class="bar__mark" aria-hidden="true"></span>
      <span class="bar__name">StreamSeeker</span>

      <span class="bar__divider" aria-hidden="true"></span>

      <input
        #searchInput
        type="search"
        class="bar__input"
        placeholder="Search a place, city or tag"
        aria-label="Search streams"
        [attr.aria-expanded]="panelOpen()"
        aria-controls="results-panel"
        [value]="filters().search"
        (input)="onSearch($event)"
        (focus)="onSearchFocus()"
      />

      <button
        type="button"
        class="bar__toggle"
        [class.bar__toggle--active]="panelOpen() || hasFilters()"
        [attr.aria-expanded]="panelOpen()"
        aria-controls="results-panel"
        (click)="onPanelToggled()"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4h12M4.5 8h7M7 12h2" />
        </svg>
        <span class="bar__count">{{ visibleCount() }}</span>
      </button>
    </div>

    @if (panelOpen()) {
      <div class="panel" id="results-panel">
        <div class="panel__filters">
          <app-category-filter
            [options]="categories()"
            [selected]="filters().categories"
            (categoryToggled)="onCategoryToggled($event)"
          />
          @if (hasFilters()) {
            <button type="button" class="panel__clear" (click)="onFiltersReset()">Clear</button>
          }
        </div>

        <div class="panel__results">
          @if (error(); as message) {
            <p class="panel__error">{{ message }}</p>
          } @else {
            <app-stream-list
              [streams]="streams()"
              [selectedId]="selected()?.id ?? null"
              [loading]="loading()"
              (streamSelected)="onStreamSelected($event)"
            />
          }
        </div>
      </div>
    }
  </div>

  <app-stream-player [stream]="selected()" (closed)="onPlayerClosed()" />
</div>
