<div class="layout">
  <aside class="sidebar">
    <header class="sidebar__head">
      <h1 class="sidebar__title">World Watcher</h1>
      <p class="sidebar__subtitle">Прямые трансляции со всего мира</p>
    </header>

    <section class="sidebar__section">
      <div class="sidebar__section-head">
        <h2 class="sidebar__heading">Категории</h2>
        @if (filters().categories.length > 0) {
          <button type="button" class="reset" (click)="onFiltersReset()">Сбросить</button>
        }
      </div>

      <app-category-filter
        [options]="categories()"
        [selected]="filters().categories"
        (categoryToggled)="onCategoryToggled($event)"
      />
    </section>

    <section class="sidebar__section">
      @if (loading()) {
        <p class="status">Загружаем каталог…</p>
      } @else if (error()) {
        <p class="status status--error">{{ error() }}</p>
      } @else {
        <p class="status">Показано трансляций: {{ visibleCount() }}</p>
      }
    </section>

    <app-stream-player [stream]="selected()" (closed)="onPlayerClosed()" />
  </aside>

  <main class="map-area">
    <app-stream-map
      [streams]="streams()"
      [selectedId]="selected()?.id ?? null"
      (streamSelected)="onStreamSelected($event)"
    />
  </main>
</div>
